# Empacota Linux (AppImage), Windows (zip) e macOS (dmg) e anexa à release da tag.
#
# POR QUE EXISTE: o pacote do Windows não pode ser gerado numa máquina Linux —
# ele precisa de MSVC, do windeployqt e das DLLs do Qt para Windows. O do macOS
# ainda menos: macdeployqt, codesign e hdiutil só existem no próprio macOS.
# Sem CI, publicar as três plataformas exigiria manter uma máquina de cada, e
# aqui só existe a de Linux — ou seja, Windows e macOS nunca sairiam.
#
# Os três jobs chamam os MESMOS scripts que se roda à mão (tools/empacotar.sh,
# tools/empacotar.ps1 e tools/empacotar_macos.sh). Nada de uma receita paralela
# aqui dentro: no dia em que ela divergisse, o pacote publicado deixaria de ser
# o pacote testado.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão para o nome do pacote (ex.: 0.1.1-alpha)'
        required: false

permissions:
  contents: write   # anexar os pacotes à release

env:
  # linuxdeploy e appimagetool são AppImages e querem FUSE, que runner de CI não
  # tem. Extrair em vez de montar é o caminho que funciona em qualquer lugar.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  linux:
    # Fixo, e no 22.04 de propósito: um AppImage só roda em glibc igual ou mais
    # nova que a da máquina onde foi montado. Montado no 24.04 (glibc 2.39), o
    # pacote da v1.0.1 exigia GLIBC_2.38 e nem abria no Pop!_OS 22.04 (glibc
    # 2.35) — quem tentou acabou rodando o .exe pelo Wine. Subir esta versão
    # quebra as distros conservadoras, e o erro só aparece na máquina do usuário.
    runs-on: ubuntu-22.04
    env:
      # O gcc 11 padrão do 22.04 tem o C++20 incompleto. O 12 vem do próprio
      # repositório, e a libstdc++ que ele exige já é a que o 22.04 instala.
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-12 ninja-build pkg-config \
            libcurl4-openssl-dev libsqlite3-dev nlohmann-json3-dev libspdlog-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # O CMake do 22.04 é o 3.22, abaixo do 3.24 que os presets pedem.
      - uses: lukka/get-cmake@latest

      # O catch2 do 22.04 é o v2; os testes são escritos para o v3.
      - name: Catch2 v3
        run: |
          git clone --depth 1 -b v3.7.1 https://github.com/catchorg/Catch2.git /tmp/catch2
          cmake -S /tmp/catch2 -B /tmp/catch2/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCATCH_INSTALL_DOCS=OFF
          cmake --build /tmp/catch2/build -j
          sudo cmake --install /tmp/catch2/build

      # O Qt do Ubuntu 22.04 é o 6.2, abaixo do 6.5 que o projeto exige — sem
      # isto o CMake pula a interface e o script aborta por não ter o que
      # empacotar. Baixar o Qt aqui também deixa o AppImage com a MESMA versão
      # do pacote do Windows, que é uma variável a menos entre as duas
      # plataformas quando alguém reporta um bug de interface.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'linux_gcc_64'
          cache: true

      # lexbor não está nos repos do Ubuntu 22.04 (chega no 24.10 como
      # liblexbor-dev). Compilar leva ~1 min e evita depender de PPA.
      - name: lexbor
        run: |
          git clone --depth 1 https://github.com/lexbor/lexbor.git /tmp/lexbor
          cmake -S /tmp/lexbor -B /tmp/lexbor/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF
          cmake --build /tmp/lexbor/build -j
          sudo cmake --install /tmp/lexbor/build
          sudo ldconfig

      # cpp-httplib (o servidor do acesso mobile) é um cabeçalho só; o do 22.04
      # é de 2022. A versão fixa é a mesma em que o projeto foi testado.
      # qrcodegen (o QR code do pareamento) também não está no 22.04: são dois
      # arquivos, compilados como biblioteca estática para o AppImage não
      # precisar levar mais um .so.
      - name: cpp-httplib e qrcodegen
        run: |
          sudo curl -fsSL -o /usr/local/include/httplib.h \
            https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.56.0/httplib.h
          git clone --depth 1 -b v1.8.0 https://github.com/nayuki/QR-Code-generator.git /tmp/qr
          g++-12 -std=c++17 -O2 -fPIC -c /tmp/qr/cpp/qrcodegen.cpp -o /tmp/qr/qrcodegen.o
          ar rcs /tmp/qr/libqrcodegencpp.a /tmp/qr/qrcodegen.o
          sudo install -Dm644 /tmp/qr/cpp/qrcodegen.hpp /usr/local/include/qrcodegencpp/qrcodegen.hpp
          sudo install -Dm644 /tmp/qr/libqrcodegencpp.a /usr/local/lib/libqrcodegencpp.a

      - name: empacotar
        run: |
          versao="${{ github.event.inputs.versao }}"
          [ -n "$versao" ] || versao="${GITHUB_REF_NAME#v}"
          tools/empacotar.sh --versao "$versao"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          # O AppImage, o portátil e as somas. O portátil existe para quem não
          # tem FUSE (container, laboratório com o módulo desabilitado), onde o
          # AppImage falha com uma mensagem que não ajuda ninguém.
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Qt não vem do vcpkg (compilar do fonte leva horas) nem pré-instalado no
      # runner. Sem `modules: qtsvg`: no Qt 6 o Svg faz parte do pacote base, e
      # pedi-lo como módulo separado faz o aqtinstall falhar com "package not
      # found" — foi assim que este job quebrou da primeira vez.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: configurar
        shell: pwsh
        run: |
          # Sem o preset `windows`: ele fixa o gerador do Visual Studio 2026, e o
          # runner tem o 2022. O que o preset traz de essencial é o toolchain do
          # vcpkg, e isso é uma linha.
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: empacotar
        shell: pwsh
        run: |
          $versao = "${{ github.event.inputs.versao }}"
          if (-not $versao) { $versao = "$env:GITHUB_REF_NAME" -replace '^v', '' }
          pwsh -File tools/empacotar.ps1 -Preset windows -Versao $versao

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/SHA256SUMS

  macos:
    # macos-14 e Apple Silicon (arm64). O runner Intel (macos-13) existe, e um
    # .dmg arm64 NAO abre num Mac Intel — quando houver quem peca, o job vira
    # uma matriz de duas arquiteturas e o nome do arquivo ja distingue as duas.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: dependencias
        run: brew install ninja lexbor nlohmann-json spdlog catch2 cpp-httplib

      # O QR code do pareamento: dois arquivos, compilados aqui (ver o job linux).
      - name: qrcodegen
        run: |
          git clone --depth 1 -b v1.8.0 https://github.com/nayuki/QR-Code-generator.git /tmp/qr
          clang++ -std=c++17 -O2 -c /tmp/qr/cpp/qrcodegen.cpp -o /tmp/qr/qrcodegen.o
          ar rcs /tmp/qr/libqrcodegencpp.a /tmp/qr/qrcodegen.o
          sudo install -d /usr/local/include/qrcodegencpp /usr/local/lib
          sudo install -m644 /tmp/qr/cpp/qrcodegen.hpp /usr/local/include/qrcodegencpp/
          sudo install -m644 /tmp/qr/libqrcodegencpp.a /usr/local/lib/

      # O mesmo Qt das outras duas plataformas: uma variavel a menos entre elas
      # quando alguem reporta um bug de interface.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'clang_64'
          cache: true

      - name: empacotar
        run: |
          versao="${{ github.event.inputs.versao }}"
          [ -n "$versao" ] || versao="${GITHUB_REF_NAME#v}"
          tools/empacotar_macos.sh --versao "$versao"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS

  publicar:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
      # Os dois jobs produzem um SHA256SUMS cada. Subir os dois com o mesmo
      # nome faria o segundo apagar o primeiro (`--clobber`), e a release
      # ficaria com as somas de uma plataforma só — o atualizador da outra
      # recusaria a instalação sem que ninguém entendesse por quê.
      - name: juntar as somas
        run: |
          find pacotes -name SHA256SUMS -exec cat {} + | sort -k2 > SHA256SUMS
          echo "— somas publicadas —"
          cat SHA256SUMS

      # `upload` exige uma release JÁ existente — e empurrar a tag não cria
      # uma. Na v0.2.0-alpha o build inteiro passou e a publicação morreu aqui
      # com "release not found", depois de 12 minutos de CI, porque até então
      # a release vinha sendo criada à mão pela interface do GitHub.
      - name: criar a release se ainda não existir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1 && exit 0
          # `--prerelease` quando a tag tem sufixo: é o que faz o GitHub não
          # anunciar um alpha como versão estável na página do projeto.
          extra=""
          case "${GITHUB_REF_NAME}" in *-*) extra="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes $extra

      - name: anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --clobber \
            SHA256SUMS \
            $(find pacotes -type f \( -name '*.AppImage' -o -name '*.zip' \
                                    -o -name '*.tar.gz' -o -name '*.dmg' \))
